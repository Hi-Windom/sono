# Sono 远程开发环境自动准备流水线
#
# 通过 $.vscode 事件，每次启动「云原生开发」时自动完成环境准备，
# 新会话无需再手动执行 npm install / 引导 pip / 安装后端依赖。
#
# 覆盖本仓库已踩过的环境坑：
#   1. 默认 NODE_ENV=production 会跳过 devDependencies（tsc/eslint/vitest 缺失）→ 显式 development
#   2. 默认镜像 Python 未预装 pip/ensurepip → 通过 get-pip.py 引导
#   3. 仅存在 python3、无 python 命令（build_android_release.sh 等依赖 python）→ 建立软链
#   4. 后端运行时依赖 + 测试依赖（pytest/httpx）+ 类型检查工具 pyright

$:
  vscode:
    - runner:
        cpus: 4
      docker:
        # 自定义开发环境
        build:
          # 指定构建镜像的 Dockerfile 文件
          dockerfile: .ide/Dockerfile
          by:
            - .ide/Dockerfile
      services:
        - vscode
        - docker
      # 通过 imports 注入自定义模型环境变量
      imports:
        - "https://cnb.cool/sc.hwd/secrets/-/blob/main/ai/custom-model.yml"
      env:
        # 关键：默认 NODE_ENV=production 会让 npm install 跳过 devDependencies，
        # 导致 typescript / eslint / vitest / @playwright/test 等开发工具全部缺失。
        NODE_ENV: development
      stages:
        - name: 配置自定义模型环境变量
          script: |
            # 将环境变量写入 .bashrc 和 .profile 以确保持久化
            echo "export CODEBUDDY_BASE_URL=\"$CODEBUDDY_BASE_URL\"" >> ~/.bashrc
            echo "export CODEBUDDY_API_KEY=\"$CODEBUDDY_API_KEY\"" >> ~/.bashrc
            echo "export CODEBUDDY_MODEL=\"$CODEBUDDY_MODEL\"" >> ~/.bashrc
            echo "export CODEBUDDY_BASE_URL=\"$CODEBUDDY_BASE_URL\"" >> ~/.profile
            echo "export CODEBUDDY_API_KEY=\"$CODEBUDDY_API_KEY\"" >> ~/.profile
            echo "export CODEBUDDY_MODEL=\"$CODEBUDDY_MODEL\"" >> ~/.profile
            # 立即在当前shell中生效
            export CODEBUDDY_BASE_URL="$CODEBUDDY_BASE_URL"
            export CODEBUDDY_API_KEY="$CODEBUDDY_API_KEY"
            export CODEBUDDY_MODEL="$CODEBUDDY_MODEL"
            echo "自定义模型环境变量已配置"
        - name: 安装前端依赖
          script: |
            set -e
            export NODE_ENV=development
            npm install --include=dev

        - name: 安装后端 Python 依赖
          script: |
            set -e
            
            # 使用 uv 安装后端依赖（从 requirements.txt）
            cd backend
            uv pip install -r requirements.txt
            
            # 安装测试依赖
            uv pip install pytest httpx pyright
            
            # 验证关键依赖
            python3 -c "import fastapi, numpy, scipy, soundfile; print('✅ 后端依赖安装成功')"

        - name: 安装类型检查工具
          script: |
            # pyright（pyproject.toml 已配置 strict 模式），非关键，失败不影响开发环境可用性
            npm install --no-save pyright 2>/dev/null \
              || echo "[prepare] pyright 安装跳过（非关键，可后续手动安装）"

        - name: 环境自检
          script: |
            echo "===== Sono 开发环境自检 ====="
            node -v
            npm -v
            python --version
            echo "===== 自检完成，开发环境已就绪 ====="

        - name: vscode go
          type: vscode:go
          imports: "https://cnb.cool/sc.hwd/secrets/-/blob/main/ai/custom-model.yml"
